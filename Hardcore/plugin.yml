name: PGF-Hardcore
version: UHC-update:gifts
api-version: 26.1
authors: [bk, CrimsonDart]
website: play.pgfmc.net
main: net.pgfmc.hardcore.Main
description: Additional UHC Functionality for PGF
depend: [PGF-Core]
load: POSTWORLD
prefix: PGF-Hardcore

commands:
  registergift:
    description: Registers your held item as a gift to be given, when a player gets an advancement. 
    usage: /<command> [advancement]
    permission: net.pgfmc.hardcore.giftregister
